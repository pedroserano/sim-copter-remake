[SystemSettings]
; Mac only. Destroy each frame's render graph on the render thread instead of in a background task.
;
; With the default (1), FRDGBuilder hands its allocator to an async delete task, and that task runs
; FSceneExtensionsUpdaters::End(), which waits on the scene-culling and instance-update tasks the
; frame launched. On Metal those waits were racing the next frame's FScene::Update: two shipping
; crashes (2026-11-14, 2026-11-15) faulted on a dangling task handle inside
; FSceneExtensionsUpdaters::End / FSceneCullingBuilder::ProcessPreSceneUpdate while the render
; thread was already in the next frame's scene update. Doing the destruction synchronously closes
; that window for a small render-thread cost.
;
; ParallelDestruction=0 alone is not enough: FRDGBuilder::~FRDGBuilder still hands the graph to
; the async deleter whenever ParallelExecute.TasksAsync exists, and that only exists in
; r.RDG.ParallelExecute=2 (the default). A third crash (2026-11-15 13:35) with just the first line
; was in the same async deleter. ParallelExecute=1 keeps passes recorded in parallel but awaits
; them inside the frame, so there are no async tasks and the destruction really is synchronous.
r.RDG.ParallelDestruction=0
r.RDG.ParallelExecute=1
